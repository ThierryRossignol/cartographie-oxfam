# Thème du dashboard : mêmes couleurs que les cartes (fond, texte, bleu IBM).
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"

[browser]
gatherUsageStats = false

[client]
# Menu réduit : pas de bouton « Deploy » ni d'options de développement.
toolbarMode = "viewer"

[server]
# Sert app/static/ (fond de carte vide, sans service tiers).
enableStaticServing = true
